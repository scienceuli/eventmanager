{% extends 'base/base.html' %}

{% block title %}Newsletter abmelden{% endblock title %}

{% block content %}
<div class="max-w-3xl mx-auto py-24 px-4 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-semibold text-gray-900">Newsletter abmelden</h1>
    <p class="mt-4 text-gray-700">
        Möchtest du <strong>{{ email }}</strong> vom VFLL-Newsletter abmelden?
    </p>
    <form method="post" class="mt-6">
        <button
            type="submit"
            class="py-3 px-5 border border-transparent text-base font-medium rounded-md text-white bg-vfllred hover:bg-vfllred focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
            Abmelden
        </button>
    </form>
</div>
{% endblock content %}
