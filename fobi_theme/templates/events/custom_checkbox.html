{% load crispy_forms_field %}

<div class="form-group">
  <div class="form-check">
    {% crispy_field field 'class' 'form-check-input' 'style' 'border-radius: 50%;' %}
    <label class="form-check-label text-gray-700 mr-3" for="{{ field.id_for_label }}">{{ field.label|safe }}</label>
    {% if field.help_text %}<p><small>{{ field.help_text|safe }}</small></p>{% endif %}
    {% for error in field.errors %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endfor %}
  </div>
</div>
