{% extends 'base/base.html' %}

{% block content %}

<div class="mt-8 mb-8 min-h-[60vh] flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-md p-8 max-w-md w-full">
        <h4 class="text-lg font-semibold mb-4">Teilnehmer löschen</h4>
        <p class="text-gray-700 mb-8">Soll <strong>{{ object }}</strong> wirklich gelöscht werden? Diese Aktion kann nicht rückgängig gemacht werden.</p>
        <form method="post" class="flex gap-4">
            {% csrf_token %}
            <button type="submit" class="bg-transparent hover:bg-red-500 text-red-700 font-semibold  py-2 px-4 border border-red-500 hover:border-transparent rounded">
                Löschen bestätigen
            </button>
            <a href="{% url 'ft-members' object.event.label %}" class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold  py-2 px-4 border border-blue-500 hover:border-transparent rounded">
                Abbrechen
            </a>
        </form>
    </div>
</div>

{% endblock %}
